name: AX2 real screen reader entry pilot
run-name: PV8 source ${{ github.sha }}
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ax2-real-reader-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  documentation-scope:
    name: Documentation scope (accessibility-real-readers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative documentation classification
        run: |
          python3 scripts/test_ci_documentation_scope.py
          python3 scripts/test_ci_full_tree_proof.py
      - name: Compare actual PR trees; uncertainty keeps full coverage
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ github.token }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_documentation_scope.py
  entry-pilot:
    needs: documentation-scope
    # Fail closed before runner allocation; never use larger or self-hosted runners.
    if: always() && needs.documentation-scope.outputs.full != 'false' && github.repository == 'viniciussucupira/marktmorgen' && github.event.repository.private == false && github.event.repository.visibility == 'public'
    name: Real reader entry (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Install isolated locked tooling without lifecycle scripts or optional recording
        working-directory: tooling/screen-reader
        run: npm ci --ignore-scripts --omit=optional --no-fund
      - name: Audit isolated tooling
        working-directory: tooling/screen-reader
        run: npm audit --omit=optional --audit-level=moderate
      - name: Install matching headed browser
        run: node node_modules/playwright-core/cli.js install ${{ runner.os == 'Windows' && 'chromium' || 'webkit' }}
      - name: Configure real screen reader on disposable standard runner
        working-directory: tooling/screen-reader
        run: node node_modules/@guidepup/setup/bin/guidepup setup --ci
      - name: Install version-matched real reader assets
        working-directory: tooling/screen-reader
        run: node node_modules/@guidepup/setup/bin/guidepup install
      - name: Assert actual entry heading announcements and log exact speech
        working-directory: tooling/screen-reader
        run: node entry-pilot.mjs
