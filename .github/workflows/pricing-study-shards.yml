        run: |
          for s in 6 5 4 3 2 1; do
            if [ "$(jq -r --arg j "merge-$s" '.[$j].outputs.status' <<<"$NEEDS")" = done ]; then echo "stage=$s" >> "$GITHUB_OUTPUT"; break; fi
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: state-${{ steps.which.outputs.stage }}
          path: state
      - name: Push the result to compute-results/pricing-v2-${{ github.run_id }}
        env:
          RUN: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "compute-results/pricing-v2-$RUN"
          cp state/pricing-study-v2-output-2026-10-18.json docs/pricing-study-v2-output-2026-10-18.json
          mkdir -p "compute-results/pricing-v2-$RUN"
          cp state/timings.json state/shards-*.json state/shards-*.sha256 "compute-results/pricing-v2-$RUN/"
          cp -r state/cache "compute-results/pricing-v2-$RUN/cache"
          git add docs/pricing-study-v2-output-2026-10-18.json "compute-results/pricing-v2-$RUN"
          git commit -m "Pricing study v2: sharded run $RUN of ${{ github.sha }}"
          git push origin "compute-results/pricing-v2-$RUN"
