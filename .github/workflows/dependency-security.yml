name: Dependency security
on:
  pull_request:
  push:
    needs: documentation-scope
    if: always() && needs.documentation-scope.outputs.full != 'false'
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation-scope:
    name: Documentation scope (dependency-security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative documentation classification
        run: python3 scripts/test_ci_documentation_scope.py
      - name: Compare actual PR trees; uncertainty keeps full coverage
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_documentation_scope.py
  audit:
    needs: documentation-scope
    if: always() && needs.documentation-scope.outputs.full != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Test audit and runtime policy failures
        run: python3 scripts/test_dependency_audit.py
      - name: Audit all dependencies and production dependencies
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-production.json || true
          python3 scripts/check_dependency_audit.py audit-all.json audit-production.json
