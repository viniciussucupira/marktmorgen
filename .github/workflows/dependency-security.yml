name: Dependency security
run-name: PV8 source ${{ github.sha }}
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: dependency-security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  documentation-scope:
    name: Documentation scope (dependency-security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative documentation classification
        run: |
          python3 scripts/test_ci_documentation_scope.py
          python3 scripts/test_ci_full_tree_proof.py
      - name: Compare actual PR trees; uncertainty keeps full coverage
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ github.token }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_documentation_scope.py
  audit:
    needs: documentation-scope
    if: ${{ !cancelled() && needs.documentation-scope.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Test audit and runtime policy failures
        run: python3 scripts/test_dependency_audit.py
      - name: Audit all dependencies and production dependencies
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-production.json || true
          python3 scripts/check_dependency_audit.py audit-all.json audit-production.json
      - name: SABOTAGE (proof only, never merged) - this job must fail
        run: exit 1

  all-checks:
    # The one check GitHub requires before main (scripts/ci_all_checks.py): it always runs and
    # passes only when every job above passed, or was skipped for a documentation-only change.
    name: All checks (dependency-security)
    needs: [audit, documentation-scope]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read every job's result; a skip counts only for a documentation-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/test_ci_all_checks.py
          python3 scripts/ci_all_checks.py
