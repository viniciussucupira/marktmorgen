name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Inspect compatible dependency corrections
        run: |
          npm audit --json > audit-before.json || true
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm audit --json > audit-after.json || true
          node -e 'const fs=require("node:fs"); for(const [tag,file] of [["AUDIT_BEFORE_JSON","audit-before.json"],["AUDIT_AFTER_JSON","audit-after.json"],["LOCK_CANDIDATE_JSON","package-lock.json"]]) console.log(tag+"="+JSON.stringify(JSON.parse(fs.readFileSync(file,"utf8"))));'
