name: Public repository data
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detector regression tests
        run: python3 scripts/test_public_data.py
      - name: Check every tracked file without logging values
        run: python3 scripts/check_public_data.py
