name: Studio accessibility matrix
on:
  pull_request:
  push:
    needs: documentation-scope
    if: always() && needs.documentation-scope.outputs.full != 'false'
    branches: [main]
permissions:
  contents: read
concurrency:
  group: studio-accessibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation-scope:
    name: Documentation scope (accessibility-studio-matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative documentation classification
        run: python3 scripts/test_ci_documentation_scope.py
      - name: Compare actual PR trees; uncertainty keeps full coverage
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_documentation_scope.py
  studio-matrix:
    needs: documentation-scope
    if: always() && needs.documentation-scope.outputs.full != 'false'
    name: Studio AAA (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Match the exact playwright-core package; browsers and OS libraries are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host --user pwuser
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      # New AX2 cases stay off for private/unknown repositories; existing cases remain.
      AX2_PUBLIC_STANDARD: ${{ github.repository == 'viniciussucupira/marktmorgen' && github.event.repository.private == false && github.event.repository.visibility == 'public' }}
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify the package matches the preinstalled browser image
        run: node -e "if (require('playwright-core/package.json').version !== '1.56.1') process.exit(1)"
      - run: npm run build
      - name: Authenticated studio and page editor at five widths with AAA and access modes
        run: node tests/e2e/accessibility-studio-matrix.mjs
