name: AX2 tooling dependency review
on:
  pull_request:
    paths:
      - "tooling/screen-reader/package.json"
      - ".github/workflows/accessibility-tooling-lock.yml"
permissions:
  contents: read
concurrency:
  group: ax2-tooling-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lock-review:
    # Evaluated before allocating a runner. Unknown/private visibility never qualifies.
    if: github.repository == 'viniciussucupira/marktmorgen' && github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Resolve isolated exact-version tools without executing package scripts
        working-directory: tooling/screen-reader
        run: npm install --package-lock-only --ignore-scripts --omit=optional --no-fund
      - name: Export only the public dependency lock for review
        working-directory: tooling/screen-reader
        run: node -e "console.log('AX2_LOCK_BEGIN');console.log(require('node:fs').readFileSync('package-lock.json').toString('base64'));console.log('AX2_LOCK_END')"
      - name: Audit dependency graph before any real reader is enabled
        working-directory: tooling/screen-reader
        run: npm audit --omit=optional --audit-level=moderate
