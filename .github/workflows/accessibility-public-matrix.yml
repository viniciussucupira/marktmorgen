name: Public accessibility matrix
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-accessibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-matrix:
    name: Public AAA (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Exact match for playwright-core; browsers and OS libraries are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host --user pwuser
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      # New AX2 cases stay off for private/unknown repositories; existing cases remain.
      AX2_PUBLIC_STANDARD: ${{ github.repository == 'viniciussucupira/marktmorgen' && github.event.repository.private == false && github.event.repository.visibility == 'public' }}
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify the package matches the preinstalled browser image
        run: node -e "if (require('playwright-core/package.json').version !== '1.56.1') process.exit(1)"
      - name: Diagnose actual engine media state before app navigation
        if: env.AX2_PUBLIC_STANDARD == 'true'
        run: node tests/e2e/accessibility-media-diagnostic.mjs
      - run: npm run build
      - name: Public entry journeys at five widths with AAA and access modes
        run: node tests/e2e/accessibility-public-matrix.mjs
